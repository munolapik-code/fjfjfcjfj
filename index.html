<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статус тривоги — Вінницький район</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #ffffff;
      background-color: #1e272e;
      transition: background 0.6s ease;
      text-align: center;
      padding: 20px;
    }

    /* Темы экрана */
    body.status-alarm {
      background: radial-gradient(circle at center, #e74c3c 0%, #96281b 100%);
    }
    body.status-clear {
      background: radial-gradient(circle at center, #2ecc71 0%, #1e8449 100%);
    }

    /* Центральная карточка */
    .card {
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 50px 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.15);
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2.8rem, 8vw, 4.8rem);
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* Плавная пульсация при тревоге */
    body.status-alarm h1 {
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.88; }
    }

    .region {
      font-size: 1.3rem;
      opacity: 0.92;
      font-weight: 500;
    }

    .footer {
      position: fixed;
      bottom: 18px;
      font-size: 0.85rem;
      opacity: 0.75;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .footer a { color: #fff; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge" id="status-badge">ПЕРЕВІРКА...</div>
    <h1 id="status-text">ОНОВЛЕННЯ</h1>
    <p class="region">Вінницький район (Вінницька область)</p>
  </div>

  <div class="footer">
    <span id="time-text">Підключення до сервера...</span>
    <span>•</span>
    <span>Джерело: <a href="https://neptun.in.ua" target="_blank">NEPTUN</a></span>
  </div>

  <script>
    async function updateStatus() {
      const statusEl = document.getElementById('status-text');
      const badgeEl = document.getElementById('status-badge');
      const timeEl = document.getElementById('time-text');

      try {
        const response = await fetch('https://neptun.in.ua');
        if (!response.ok) throw new Error('Помилка мережі');
        
        const data = await response.json();

        // Проверяем активную тревогу в Винницком районе или всей Винницкой области
        const isRaion = (data.raions || []).some(r => r.name === 'Вінницький район');
        const isOblast = (data.oblasts || []).some(o => o.name === 'Вінницька область');

        if (isRaion || isOblast) {
          document.body.className = 'status-alarm';
          badgeEl.textContent = 'УВАГА! ЗАГРОЗА';
          statusEl.textContent = 'ТРИВОГА';
        } else {
          document.body.className = 'status-clear';
          badgeEl.textContent = 'БЕЗПЕЧНО';
          statusEl.textContent = 'ВІДБІЙ';
        }

        const now = new Date().toLocaleTimeString('uk-UA');
        timeEl.textContent = `Оновлено о ${now}`;

      } catch (error) {
        console.error(error);
        timeEl.textContent = 'Помилка зв’язку. Наступна спроба через 15 сек...';
      }
    }

    // Запуск сразу при открытии и обновление каждые 15 секунд
    updateStatus();
    setInterval(updateStatus, 15000);
  </script>

</body>
</html>
